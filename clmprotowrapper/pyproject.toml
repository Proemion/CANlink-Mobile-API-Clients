[project]
name = "clmprotowrapper"
version = "3.4.1"
description = "Protobuf API bindings for the CANlink mobile 10000."
authors = [
    {name = "Proemion GmbH", email = "info@proemion.com"}
]
license = "Apache-2.0"
requires-python = ">=3.12"
keywords = ["CANlink", "CLM10k", "protobuf", "CAN"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
]
# The protobuf floor must match the "Protobuf Python Version" header in
# clmprotowrapper/clmapi_pb2.py, which comes from the grpcio-tools pinned in
# [build-system]. Bump both together.
dependencies = [
    "protobuf (>=7.35.1,<8.0.0)",
]

[project.urls]
Repository = "https://github.com/Proemion/CANlink-Mobile-API-Clients"
Issues = "https://github.com/Proemion/CANlink-Mobile-API-Clients/issues"

[build-system]
# build.py regenerates clmprotowrapper/clmapi_pb2.py on every build, and the
# grpcio-tools version decides the protobuf version stamped into it (1.85.1
# stamps 7.35.1). Pinned so every build stamps the same version. Bump together
# with the protobuf floor in [project] dependencies.
requires = ["poetry-core>=2.0.0,<3.0.0", "grpcio-tools==1.85.1"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
build = "build.py"
packages = [{include = "clmprotowrapper"}]
include = ["clmapi.proto"]
